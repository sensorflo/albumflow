[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "albumflow"
version = "0.1.0"
description = "Mirror Lightroom albums to Google Photos, WordPress and local folders"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest", "pillow"]

[project.scripts]
albumflow = "albumflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
